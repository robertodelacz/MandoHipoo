<!-- PRE PLD · Mis documentos y envío a revisión -->
<style>
#rv-root{--primary:#35B7C5;--teal:#0f8594;--navy:#364494;--ink:#1a224a;--muted:#5a6488;--line:#dbe2ef;--soft:#f4f7fc;--tint:#e8f6f8;--ok:#0f9d6e;--ok-bg:#e3f6ee;--err:#d92d3f;--err-bg:#fdecee;--warn:#9a6700;--warn-bg:#fff4d6;color:var(--ink)}
#rv-root .cx{max-width:1280px;margin:0 auto;padding:26px 22px 60px;color:var(--ink);font-family:'Inter',system-ui,sans-serif;position:relative;z-index:1}
#rv-root .cx-panel{background:#fff;border:0;border-radius:22px;padding:26px 28px;margin-bottom:20px;box-shadow:0 1px 2px rgba(26,34,74,.05),0 18px 40px -18px rgba(26,34,74,.28)}
#rv-root .cx-panel h3{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px;letter-spacing:-.2px;color:var(--ink);margin-bottom:14px}
#rv-root .cx-note{font-size:13px;color:#16465a;line-height:1.5;background:var(--tint);border:1px solid #bfe6ec;border-radius:12px;padding:12px 14px}
#rv-root .cx-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
#rv-root .cx-btn{display:inline-block;border:1px solid #b9c4de;background:#fff;color:var(--navy);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;line-height:1.2;transition:all .12s}
#rv-root .cx-btn:hover{border-color:var(--primary);background:var(--tint)}
#rv-root .cx-btn.pri{background:var(--navy);border-color:var(--navy);border-bottom:3px solid var(--primary);color:#fff;box-shadow:0 2px 6px rgba(54,68,148,.28)}
#rv-root .cx-btn.pri:hover{background:#2c3a82;border-color:#2c3a82;border-bottom-color:var(--primary)}
#rv-root .cx-btn.ok{border-color:#9fdcc4;color:#0a6b4a}
#rv-root .cx-btn.warn{border-color:#f0d28a;color:var(--warn)}
#rv-root .cx-btn.danger{border-color:#f0b4bb;color:var(--err)}
#rv-root .cx-btn.danger:hover{background:var(--err-bg);border-color:var(--err);color:var(--err)}
#rv-root .cx-btn:disabled{opacity:.45;cursor:not-allowed}
#rv-root .cx-btn.big{font-size:15px;padding:14px 26px;margin-top:6px}
#rv-root .cx-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:22px}
#rv-root .cx-kpi{background:#fff;border:0;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(26,34,74,.05),0 12px 28px -16px rgba(26,34,74,.3);cursor:pointer;text-align:left;color:var(--ink);font-family:'Inter',sans-serif}
#rv-root .cx-kpi:hover{box-shadow:0 1px 2px rgba(26,34,74,.05),0 12px 28px -12px rgba(53,183,197,.55)}
#rv-root .cx-kpi b{display:block;font-family:'Montserrat',sans-serif;font-size:36px;line-height:1.1;color:var(--navy)}
#rv-root .cx-kpi span{font-size:12px;color:var(--muted);font-weight:600}
#rv-root .cx-kpi.al b{color:var(--warn)}
#rv-root .cx-kpi.mal b{color:var(--err)}
#rv-root .cx-kpi small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
#rv-root .cx-kpis.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:16px}
#rv-root .cx-kpis.mini .cx-kpi b{font-size:26px}
#rv-root .cx-kpis.mini .cx-kpi{padding:12px}
#rv-root .cx-grid2{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:980px){#rv-root .cx-grid2{grid-template-columns:1fr 1fr}}
#rv-root .cx-wrap{overflow-x:auto}
#rv-root table.cx-tb{width:100%;border-collapse:collapse;font-size:13px}
#rv-root table.cx-tb th{text-align:left;color:var(--muted);background:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 10px;border-bottom:0;white-space:nowrap}
#rv-root table.cx-tb th:first-child{border-radius:10px 0 0 10px}#rv-root table.cx-tb th:last-child{border-radius:0 10px 10px 0}
#rv-root table.cx-tb td{padding:11px 10px;border-bottom:1px solid #eef1f8;vertical-align:top}
#rv-root table.cx-tb td.ac{white-space:nowrap}
#rv-root table.cx-tb td.ac .cx-btn{margin:0 4px 4px 0}
#rv-root .rv-lnk{color:var(--teal);font-weight:700;text-decoration:none}
#rv-root .rv-lnk:hover{text-decoration:underline}
#rv-root .cx-est{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;border:0;white-space:nowrap}
#rv-root .cx-est.e-BORRADOR,#rv-root .cx-est.e-SIN_ENVIAR,#rv-root .cx-est.e-SIN_TERMINAR{background:#eef1f8;color:#3c4670}
#rv-root .cx-est.e-COMPLETO{background:#e8f4fc;color:#0c4a6e}
#rv-root .cx-est.e-EN_REVISION{background:var(--warn-bg);color:var(--warn)}
#rv-root .cx-est.e-OBSERVADO{background:var(--err-bg);color:#8f1b29}
#rv-root .cx-est.e-APROBADO,#rv-root .cx-est.e-REVISADO{background:var(--ok-bg);color:#0a6b4a}
#rv-root .cx-flag{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warn-bg);border:0;border-radius:6px;padding:2px 7px}
#rv-root .cx-dim{color:var(--muted);font-size:12px}
#rv-root .cx-empty{color:var(--muted);font-size:13.5px;padding:8px 0}
#rv-root .cx-li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f8;font-size:12.5px}
#rv-root .cx-li:last-child{border-bottom:0}
#rv-root .cx-modal{position:fixed;inset:0;background:rgba(26,34,74,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:60;display:none;overflow:auto;padding:20px}
#rv-root .cx-modal.open{display:block}
#rv-root .cx-box{max-width:860px;margin:0 auto;background:#fff;border:0;border-radius:22px;padding:24px;box-shadow:0 30px 80px -20px rgba(13,18,43,.6)}
#rv-root .cx-busy{position:fixed;inset:0;background:rgba(26,34,74,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:80;display:none;align-items:center;justify-content:center}
#rv-root .cx-busy.on{display:flex}
#rv-root .cx-busy-card{display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;border:0;border-radius:20px;padding:30px 44px;box-shadow:0 30px 80px -20px rgba(13,18,43,.6)}
#rv-root .cx-busy-card span{font-weight:700;color:var(--ink);font-size:14px;font-family:'Inter',sans-serif}
#rv-root .cx-spin{width:32px;height:32px;border:4px solid #dbe2ef;border-top-color:var(--primary);border-radius:50%;animation:cxgira .75s linear infinite}
@keyframes cxgira{to{transform:rotate(360deg)}}
#rv-root .cx-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--ok);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:13.5px;z-index:90;transition:opacity .25s,transform .25s;max-width:90vw;box-shadow:0 12px 28px -10px rgba(13,18,43,.5)}
#rv-root .cx-toast.show{opacity:1;transform:translate(-50%,0)}
#rv-root .cx-toast.err{background:var(--err);color:#fff}
#rv-root .cx-tab-abrir{text-align:center;padding:48px 24px}
#rv-root .cx-tab-abrir .ic{font-size:52px;margin-bottom:10px}
#rv-root .cx-tab-abrir .cx-note{max-width:520px;margin:0 auto 20px}
#rv-root .cx-doc{display:inline-block;margin:4px 4px 0 0;font-size:10.5px;font-weight:800;color:var(--teal);background:var(--tint);border:0;border-radius:6px;padding:2px 7px;text-decoration:none}
#rv-root .rv-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
#rv-root .rv-chip{border:0;background:#fff;color:var(--muted);border-radius:999px;padding:8px 14px;font:700 12.5px 'Inter',sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(26,34,74,.08),0 0 0 1px rgba(26,34,74,.06);transition:box-shadow .15s,color .15s}
#rv-root .rv-chip:hover{color:var(--ink);box-shadow:0 4px 12px -4px rgba(26,34,74,.25),0 0 0 1px rgba(53,183,197,.7)}
#rv-root .rv-chip.on{background:var(--navy);color:#fff;box-shadow:0 8px 18px -8px rgba(54,68,148,.7)}
#rv-root .rv-chip.hot{color:var(--err);box-shadow:0 0 0 1px #f0b4bb}
#rv-root .rv-chip.on.hot{color:#fff;box-shadow:0 8px 18px -8px rgba(54,68,148,.7)}
#rv-root .rv-q{margin-left:auto;min-width:220px;max-width:100%;height:42px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--ink);font:500 13.5px 'Inter',sans-serif;box-shadow:0 0 0 1px rgba(26,34,74,.14) inset}
#rv-root .rv-q:focus{outline:none;box-shadow:0 0 0 1px var(--primary) inset,0 0 0 4px rgba(53,183,197,.22)}
#rv-root .rv-sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
</style>
<div id="rv-root">
<div class="cx" style="padding:0 0 24px;max-width:none">
  <div class="cx-panel">
    <h3>Mis Pre PLD y revisión</h3>
    <div class="cx-note" style="margin-bottom:14px">Después de generar tu Pre PLD, <b>envíalo a revisión</b> para que la coordinación lo revise. Si lo observa, verás aquí su comentario: corrígelo en el documento y vuelve a enviarlo.</div>
    <div class="cx-tools"><button type="button" class="cx-btn" data-a="refrescar">↻ Actualizar</button></div>
    <div class="rv-chips" data-r="chips" style="display:none"></div>
    <div data-r="lista"><div class="cx-empty">Abre esta pestaña para ver tus documentos.</div></div>
  </div>
</div>
<div class="cx-busy" data-r="busy"><div class="cx-busy-card"><div class="cx-spin"></div><span data-r="busyTxt">Procesando…</span></div></div>
<div class="cx-toast" data-r="toast"></div>

</div>
<script>
/* ═══ PRE PLD · Mis documentos y envío a revisión (asesor) ═══ */
(function () {
  'use strict';
  var ROOT = document.getElementById('rv-root');
  function q(k) { return ROOT.querySelector('[data-r="' + k + '"]'); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var EST = { SIN_ENVIAR: 'Sin enviar', EN_REVISION: 'En revisión', OBSERVADO: 'Observado', REVISADO: 'Revisado' };
  function toast(m, err) { var t = q('toast'); t.textContent = m; t.className = 'cx-toast show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(function () { t.className = 'cx-toast'; }, err ? 7000 : 3500); }
  function busy(on, txt) { q('busy').className = 'cx-busy' + (on ? ' on' : ''); if (txt) q('busyTxt').textContent = txt; }
  /* Nunca se queda "cargando" para siempre: si el servidor no contesta en 25 s, se libera la pantalla sola, con
     aviso para reintentar — sin tener que refrescar la página. */
  function srv(fn, args, ok, txt, silencioso) {
    if (!(typeof google !== 'undefined' && google.script && google.script.run)) { toast('Solo disponible dentro de la aplicación de Apps Script.', true); return; }
    if (!silencioso) busy(true, txt || 'Cargando…');
    var listo = false;
    var vencido = setTimeout(function () { if (listo) return; listo = true; busy(false); if (!silencioso) toast('El servidor está tardando más de lo normal. Vuelve a intentarlo.', true); }, 25000);
    var r = google.script.run
      .withSuccessHandler(function (x) { if (listo) return; listo = true; clearTimeout(vencido); busy(false); ok(x); })
      .withFailureHandler(function (e) { if (listo) return; listo = true; clearTimeout(vencido); busy(false); if (window.HIPOO_acceso && HIPOO_acceso(e)) return; if (!silencioso) toast(String((e && e.message) || e).replace(/^Error:\s*/, ''), true); });
    r[fn].apply(r, args);
  }
  var FILAS = [], FILTRO = 'todos', BUSCA = '', ORDEN = { OBSERVADO: 0, SIN_ENVIAR: 1, EN_REVISION: 2, REVISADO: 3 };
  var CHIPS = [['todos', 'Todos'], ['OBSERVADO', 'Por corregir'], ['SIN_ENVIAR', 'Sin enviar'], ['EN_REVISION', 'En revisión'], ['REVISADO', 'Revisados']];
  function norm(t) { return String(t || '').toLowerCase().normalize ? String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') : String(t || '').toLowerCase(); }
  function pinta() {
    var cuenta = { todos: FILAS.length }; FILAS.forEach(function (r) { cuenta[r.estado] = (cuenta[r.estado] || 0) + 1; });
    var ch = q('chips'); ch.style.display = FILAS.length ? '' : 'none';
    ch.innerHTML = CHIPS.map(function (c) { return '<button type="button" class="rv-chip' + (FILTRO === c[0] ? ' on' : '') + (c[0] === 'OBSERVADO' && cuenta.OBSERVADO ? ' hot' : '') + '" data-f="' + c[0] + '">' + c[1] + ' · ' + (cuenta[c[0]] || 0) + '</button>'; }).join('') +
      '<input type="search" class="rv-q" data-r="q" placeholder="Buscar documento u operación…" value="' + esc(BUSCA) + '">';
    var b = norm(BUSCA);
    var rows = FILAS.filter(function (r) { return (FILTRO === 'todos' || r.estado === FILTRO) && (!b || norm(r.nombre + ' ' + r.operacion + ' ' + r.asociados).indexOf(b) >= 0); })
      .sort(function (x, y) { var d = ORDEN[x.estado] - ORDEN[y.estado]; return d || (x.creado < y.creado ? 1 : -1); });   // lo que requiere acción del asesor va primero
    q('lista').innerHTML = rows.length ? '<div class="cx-wrap"><table class="cx-tb"><thead><tr><th>Generado</th><th>Documento</th><th>Operación</th><th>Estado</th><th>Comentario de la coordinación</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var puede = r.estado === 'SIN_ENVIAR' || r.estado === 'OBSERVADO' || (r.estado === 'REVISADO' && r.modificadoDespues);
        var cuando = r.estado === 'EN_REVISION' && r.fechaEnvio ? 'Enviado ' + r.fechaEnvio : (r.fechaRevision ? 'Revisó ' + (r.revisadoPor || '').split('@')[0] + ' · ' + r.fechaRevision : '');
        return '<tr><td>' + esc(r.creado) + '</td><td><a href="' + esc(r.url) + '" target="_blank" rel="noopener" class="rv-lnk">' + esc(r.nombre) + '</a></td><td>' + esc(r.operacion) + '</td>' +
          '<td><span class="cx-est e-' + esc(r.estado) + '">' + esc(EST[r.estado] || r.estado) + '</span>' + (cuando ? '<span class="rv-sub">' + esc(cuando) + '</span>' : '') + (r.modificadoDespues ? '<div class="cx-flag">⚠ modificado después</div>' : '') + '</td><td class="cx-dim">' + esc(r.comentario) + '</td>' +
          '<td class="ac">' + (puede ? '<button type="button" class="cx-btn pri" data-env="' + esc(r.id) + '">📤 ' + (r.estado === 'OBSERVADO' ? 'Reenviar a revisión' : 'Enviar a revisión') + '</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>'
      : '<div class="cx-empty">' + (FILAS.length ? 'Ningún documento coincide con ese filtro o búsqueda.' : 'Todavía no has generado ningún Pre PLD con esta cuenta.') + '</div>';
  }
  function cargar(silencioso) {
    srv('PLD_misDocumentos', [], function (rows) { FILAS = rows || []; if (FILTRO !== 'todos' && !FILAS.some(function (r) { return r.estado === FILTRO; })) FILTRO = 'todos'; pinta(); }, null, silencioso);
  }
  /* Actualización silenciosa (sin pantalla de "cargando"): la llama la pantalla principal cuando llegan novedades de Pre PLD. */
  function refrescar() { if (ROOT.offsetParent !== null) cargar(true); }
  function enviar(id, btn) {
    var hazlo = function () {
      srv('PLD_enviarRevision', [id], function () {
        toast('Enviado a revisión.'); if (btn) { btn.textContent = '✅ Enviado a revisión'; btn.disabled = true; } cargar();
      }, 'Enviando…');
    };
    if (window.HIPOO_confirma) window.HIPOO_confirma({ titulo: '¿Ya terminaste de llenarlo?', texto: 'Al enviarlo, la coordinación recibirá un aviso para revisar este Pre PLD. Hazlo solo cuando ya esté completo.', ok: 'Sí, enviar', tono: 'info', icono: 'enviar' }, hazlo);
    else if (window.confirm('¿Ya terminaste de llenar este Pre PLD? Se enviará a la coordinación para su revisión.')) hazlo();
  }
  ROOT.addEventListener('input', function (e) { if (e.target.getAttribute('data-r') === 'q') { BUSCA = e.target.value; var pos = e.target.selectionStart; pinta(); var n = q('q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { } } } });
  ROOT.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-f')) { FILTRO = b.getAttribute('data-f'); pinta(); return; }
    if (b.getAttribute('data-env')) enviar(b.getAttribute('data-env'), b); else if (b.getAttribute('data-a') === 'refrescar') cargar();
  });
  window.PLDREV = { cargar: cargar, enviar: enviar, refrescar: refrescar };
})();

</script>
