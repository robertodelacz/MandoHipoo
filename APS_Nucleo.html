  /* ── validación ── */
  // "¿Cuenta con RFC?" Sí (modo vacío/'normal', el de siempre) / No (cualquier otro valor — incluye los modos
  // anteriores 'extranjero'/'sin_rfc'/'vacio', por si algún registro viejo los trae guardados).
  function tieneRfc(modo) { return !modo || modo === 'normal'; }
  function rfcTexto(rfc, modo) { return tieneRfc(modo) ? String(rfc || '') : 'No proporcionado'; }
  var RE_RFC = /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/;
  /* Límites de sentido común. Si algún caso real queda fuera, se ajusta aquí y en ningún otro lado. */
  var LIM = { nombre: 150, idDoc: 80, corto: 120, largo: 400, precioMin: 50000, precioMax: 500000000, pctMax: 20, mesesMax: 120, rentaMin: 1000, rentaMax: 5000000, depositoMeses: 6, rentasAdelMax: 12 };
  var RE_MAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function vacio(s) { return !String(s === null || s === undefined ? '' : s).trim(); }
  function rfcOk(s) { return RE_RFC.test(String(s || '').toUpperCase().trim()); }
  function rfcOkOVacio(s) { s = String(s || '').trim(); return !s || rfcOk(s); }      // vacío pasa; si SÍ se escribe algo, debe tener el formato correcto (atrapa errores de dedo)
  function rfcRepHtml(s) { return String(s || '').trim() ? txt(s) : '<i>No proporcionado</i>'; }
  function validar(d) {
    var p = [], P = d.propietarios || [], multi = P.length > 1;
    function need(step, key, msg, cond) { if (cond) p.push({ step: step, k: key, msg: msg }); }
    function dirValida(pre, x, etq, step) {
      x = x || {};
      var nm = /^[0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ][0-9A-Za-zÁÉÍÓÚÜÑáéíóúüñ\-\/ ]{0,19}$/, cdmx = U.esCDMX(x.estado);
      var corto = function (s, n) { return String(s || '').replace(/[,;]/g, ' ').trim().length < n; };
      need(step, pre + '.calle', etq + ': calle o avenida', corto(x.calle, 3));
      need(step, pre + '.numExt', etq + ': número exterior (o S/N)', !nm.test(String(x.numExt || '').trim()));
      need(step, pre + '.numInt', etq + ': número interior no válido', !!String(x.numInt || '').trim() && !nm.test(String(x.numInt).trim()));
      need(step, pre + '.colonia', etq + ': colonia', corto(x.colonia, 2));
      need(step, pre + '.alcaldia', etq + ': ' + (cdmx ? 'alcaldía' : 'municipio'), corto(x.alcaldia, 2));
      need(step, pre + '.estado', etq + ': estado', U.ESTADOS_MX.indexOf(x.estado) < 0);
      need(step, pre + '.cp', etq + ': código postal (5 dígitos)', !/^\d{5}$/.test(String(x.cp || '').trim()));
    }
    need('operacion', 'tipo', 'Elige el tipo de operación', ['venta', 'renta', 'ambas'].indexOf(d.tipo) < 0);
    if (!P.length) need('cliente', 'propietarios.0.nombre', 'Agrega al menos un propietario', true);
    P.forEach(function (o, i) {
      var pre = 'propietarios.' + i + '.', t = multi ? ' (propietario ' + (i + 1) + ')' : '', pm = o.naturaleza === 'PM';
      need('cliente', pre + 'naturaleza', 'Persona física o moral' + t, ['PF', 'PM'].indexOf(o.naturaleza) < 0);
      need('cliente', pre + 'nombre', (pm ? 'Razón social' : 'Nombre completo') + t, vacio(o.nombre));
      if (pm) {
        (o.representantes || []).forEach(function (r, j) {
          need('cliente', pre + 'representantes.' + j + '.nombre', 'Nombre del representante ' + (j + 1) + t, vacio(r.nombre));
          need('cliente', pre + 'representantes.' + j + '.trato', 'Sr. o Sra. del representante ' + (j + 1) + t, !r.trato);
        });
        if (!(o.representantes || []).length) need('cliente', pre + 'nombre', 'Agrega un representante' + t, true);
        need('cliente', pre + 'rfcRep', 'El RFC del representante' + t + ' no tiene el formato correcto (12 o 13 caracteres) — puedes dejarlo vacío si no lo tiene', !rfcOkOVacio(o.rfcRep));
        need('cliente', pre + 'poderNotario', 'Notario del poder' + t, vacio(o.poderNotario));
        need('cliente', pre + 'poderNotariaNum', 'Núm. de notaría del poder' + t, vacio(o.poderNotariaNum));
        need('cliente', pre + 'poderEscrituraNum', 'Núm. de escritura del poder' + t, vacio(o.poderEscrituraNum));
        need('cliente', pre + 'poderFecha', 'Fecha de la escritura del poder' + t, !U.fechaLarga(o.poderFecha));
      }
      if (!tieneRfc(o.rfcModo)) { /* no cuenta con RFC o no lo quiso dar: no se exige capturar un RFC con formato */ }
      else need('cliente', pre + 'rfc', (pm ? 'RFC de la empresa' : 'RFC') + t + ' (12 o 13 caracteres)', !rfcOk(o.rfc));
      need('cliente', pre + 'idDoc', 'Documento y número de identificación' + t, vacio(o.idDoc));
      need('cliente', pre + 'idAutoridad', 'Autoridad que emitió la identificación' + t, vacio(o.idAutoridad));
    });
    dirValida('contactoDir', d.contactoDir, 'Domicilio para notificaciones', 'cliente');
    need('cliente', 'telMovil', 'Teléfono móvil (10 dígitos)', String(d.telMovil || '').replace(/\D/g, '').length < 10);
    need('cliente', 'correo', 'Correo electrónico válido', !RE_MAIL.test(String(d.correo || '').trim()));
    need('inmueble', 'inmDomicilio', 'Escribe el domicilio del inmueble (tal como aparece en la escritura)', !String(d.inmDomicilio || '').trim());
    need('inmueble', 'escrituraNum', 'Núm. de escritura del inmueble', vacio(d.escrituraNum));
    need('inmueble', 'escrituraFecha', 'Fecha de la escritura del inmueble', !U.fechaLarga(d.escrituraFecha));
    need('inmueble', 'notarioNombre', 'Notario público de la escritura', vacio(d.notarioNombre));
    need('inmueble', 'notariaNumDe', 'Núm. y lugar de la notaría', vacio(d.notariaNumDe));
    need('inmueble', 'folioReal', 'Folio Real o Partida (RPP)', vacio(d.folioReal));
    if (tieneVenta(d)) {
      var pr = num(d.precio), hp = num(d.honorariosPct), vm = num(d.vigenciaVentaMeses);
      need('venta', 'precio', 'Precio de venta', isNaN(pr) || pr <= 0);
      need('venta', 'vigenciaVentaMeses', 'Vigencia en meses (venta)', isNaN(vm) || vm < 1);
      need('venta', 'honorariosPct', 'Porcentaje de honorarios (mayor a 0 y hasta 100)', isNaN(hp) || hp <= 0 || hp > 100);
      need('venta', 'ivaVenta', 'Honorarios de venta: ¿más IVA o IVA incluido?', ['mas', 'incluido'].indexOf(d.ivaVenta) < 0);
      need('venta', 'modalidadVenta', 'Modalidad de corretaje (venta)', !d.modalidadVenta);
      var aj = d.ajustes || [], prevM = pr, prevF = '', ini = U.fechaLarga(d.fecha) ? d.fecha : '', fin = (ini && !isNaN(vm) && vm >= 1) ? U.sumaMeses(ini, Math.round(vm)) : '';
      need('venta', 'ajustes', 'Máximo 15 ajustes de precio', aj.length > 15);
      aj.forEach(function (a, i) {
        var k = 'ajustes.' + i + '.', n = i + 1, m = num(a.monto), fv = U.fechaLarga(a.fecha);
        if (!fv) need('venta', k + 'fecha', 'Fecha del ajuste ' + n, true);
        else if (prevF && a.fecha <= prevF) need('venta', k + 'fecha', 'Ajuste ' + n + ': la fecha debe ser posterior a la del ajuste anterior', true);
        else if (ini && a.fecha <= ini) need('venta', k + 'fecha', 'Ajuste ' + n + ': la fecha debe ser posterior a la firma (' + U.fechaLarga(ini) + ')', true);
        else if (fin && a.fecha > fin) need('venta', k + 'fecha', 'Ajuste ' + n + ': la fecha queda fuera de la vigencia (hasta ' + U.fechaLarga(fin) + ')', true);
        if (fv) prevF = a.fecha;
        if (isNaN(m) || m <= 0) need('venta', k + 'monto', 'Nuevo precio del ajuste ' + n, true);
        else { if (!isNaN(prevM) && m >= prevM) need('venta', k + 'monto', 'Ajuste ' + n + ': el nuevo precio debe ser menor al anterior (los ajustes son a la baja)', true); prevM = m; }
      });
    }
    if (tieneRenta(d)) {
      var rm = num(d.rentaMonto), dp = num(d.deposito), ra = num(d.rentasAdelantadas), vr = num(d.vigenciaRentaMeses);
      need('renta', 'rentaMonto', 'Renta mensual', isNaN(rm) || rm <= 0);
      need('renta', 'mantenimiento', 'Mantenimiento incluido o no', !d.mantenimiento);
      need('renta', 'vigenciaRentaMeses', 'Vigencia en meses (arrendamiento)', isNaN(vr) || vr < 1);
      need('renta', 'duracion', 'Duración mínima del arrendamiento', !d.duracion);
      need('renta', 'duracionOtro', 'Especifica el otro plazo', d.duracion === 'otro' && vacio(d.duracionOtro));
      need('renta', 'garantias', 'Elige al menos una garantía', !(d.garantias || []).length);
      need('renta', 'deposito', 'Depósito en garantía', isNaN(dp) || dp <= 0);
      need('renta', 'rentasAdelantadas', 'Rentas adelantadas (puede ser 0)', isNaN(ra) || ra < 0);
      need('renta', 'destino', 'Destino o uso autorizado', !d.destino);
      need('renta', 'menores', '¿Aceptan menores de 12 años?', !d.menores);
      need('renta', 'mascotas', '¿Aceptan mascotas?', !d.mascotas);
      need('renta', 'modalidadRenta', 'Modalidad de corretaje (arrendamiento)', !d.modalidadRenta);
      need('renta', 'ivaRenta', 'Honorarios de arrendamiento: ¿más IVA o IVA incluido?', ['mas', 'incluido'].indexOf(d.ivaRenta) < 0);
    }
    need('firma', 'lugar', 'Lugar de firma', vacio(d.lugar));
    need('firma', 'fecha', 'Fecha de firma', !U.fechaLarga(d.fecha));
    /* ── Límites de sentido común (ajustables en LIM): atrapan errores de dedo y texto desmedido ── */
    var hoyIso = new Date().toISOString().slice(0, 10), lejos = new Date(Date.now() + 366 * 86400000).toISOString().slice(0, 10);
