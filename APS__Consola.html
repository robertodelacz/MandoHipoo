<!-- CONSOLA DE COORDINACIÓN · solo se entrega a la administradora (ver APS_incluir) -->
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   MESA DE MANDO DE LA COORDINACIÓN (Revisión de contratos APS y de Pre PLD)
   Mismo lenguaje que la pantalla principal: encabezado azul con retícula,
   tarjetas blancas sin borde de color, botones grandes, números que cuentan.
   ═══════════════════════════════════════════════════════════════════════════ */
#con-root{--primary:#35B7C5;--teal:#0f8594;--navy:#364494;--navy2:#2b377a;--ink:#1a224a;--muted:#5a6488;--line:#dbe2ef;--soft:#f4f7fc;--tint:#e8f6f8;--ok:#0f9d6e;--ok-bg:#e3f6ee;--err:#d92d3f;--err-bg:#fdecee;--warn:#9a6700;--warn-bg:#fff4d6;--amber:#ffb03b;
  color:var(--ink);max-width:1320px;margin:0 auto;font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5}
#con-root *{box-sizing:border-box}
#con-root button{font-family:inherit}
#con-root svg{display:block;flex:none}
#con-root :focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ── Encabezado ── */
#con-root .cx-hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:30px 36px 92px;border-bottom:5px solid var(--primary);
  background:radial-gradient(90% 140% at 100% 0%,#3d4fb0 0%,transparent 55%),linear-gradient(115deg,#364494 0%,#232d61 60%,#1a224a 100%);box-shadow:0 30px 60px -28px rgba(26,34,74,.7)}
#con-root .cx-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px}
#con-root .cx-hero::after{content:"";position:absolute;right:44px;bottom:60px;width:370px;height:200px;pointer-events:none;background:no-repeat right bottom/contain url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 240' fill='none' stroke='%237be0ea' stroke-opacity='.3' stroke-width='1.7' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M6 226H434'/%3E%3Cpath d='M200 226V118L286 52l86 66v108M286 52V30M300 40V30'/%3E%3Cpath d='M256 226v-58h60v58M284 168v58'/%3E%3Cpath d='M222 120h34v34h-34zM222 137h34M239 120v34M326 130h28v28h-28zM326 144h28M340 130v28'/%3E%3Cpath d='M92 226V150l52-40 52 40v76M122 226v-40h44v40M110 156h28v22h-28z'/%3E%3Cpath d='M26 226v-86M26 140h54v38H26zM40 154h26M40 166h18'/%3E%3Ccircle cx='392' cy='176' r='15'/%3E%3Cpath d='M392 191v35M392 206h14M392 218h10M377 176h-9M407 176h9'/%3E%3C/svg%3E")}
#con-root .cx-hero-in{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
#con-root .cx-eyebrow{display:inline-flex;align-items:center;gap:9px;font:800 12px 'Montserrat',sans-serif;letter-spacing:3px;text-transform:uppercase;color:#8fe1ea;margin-bottom:12px}
#con-root .cx-eyebrow svg{width:18px;height:18px}
#con-root .cx-title{margin:0;font:600 clamp(30px,4.2vw,46px)/1.05 'Fraunces',Georgia,serif;letter-spacing:-.4px;color:#fff}
#con-root .cx-title em{font-style:italic;color:#7be0ea}
#con-root .cx-sub{margin:12px 0 0;max-width:620px;font-size:16px;line-height:1.55;color:#cfdcf5}
#con-root .cx-hr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#con-root .cx-live{display:inline-flex;align-items:center;gap:9px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font:700 12.5px 'Inter',sans-serif;color:#dff6f2}
#con-root .cx-live i{width:9px;height:9px;border-radius:50%;background:#3be8a5;animation:cxPulso 2s infinite}
#con-root .cx-live.off i{background:var(--amber);animation:none}
@keyframes cxPulso{0%{box-shadow:0 0 0 0 rgba(59,232,165,.6)}70%{box-shadow:0 0 0 10px rgba(59,232,165,0)}100%{box-shadow:0 0 0 0 rgba(59,232,165,0)}}
#con-root .cx-refresh{display:inline-flex;align-items:center;gap:10px;min-height:50px;padding:0 24px;border:0;border-radius:999px;background:#fff;color:var(--navy);font:800 15px 'Montserrat',sans-serif;cursor:pointer;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);transition:transform .15s,box-shadow .15s}
#con-root .cx-refresh:hover{transform:translateY(-2px)}
#con-root .cx-refresh:active{transform:scale(.97)}
#con-root .cx-refresh svg{width:19px;height:19px}
#con-root .cx-refresh.girando svg{animation:cxgira .8s linear infinite}

/* ── Contenido ── */
#con-root .cx{position:relative;z-index:1;padding:0 22px 60px}

/* ── Tarjetas de números (encimadas al encabezado) ── */
#con-root .cx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin:-58px 0 26px}
#con-root .cx-kpi{position:relative;display:flex;align-items:center;gap:14px;text-align:left;border:0;cursor:pointer;color:var(--ink);background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 2px 4px rgba(26,34,74,.05),0 24px 44px -18px rgba(26,34,74,.38);transition:translate .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;animation:cxIn .6s cubic-bezier(.2,.8,.2,1) both}
#con-root .cx-kpi:nth-child(2){animation-delay:.06s}#con-root .cx-kpi:nth-child(3){animation-delay:.12s}#con-root .cx-kpi:nth-child(4){animation-delay:.18s}#con-root .cx-kpi:nth-child(5){animation-delay:.24s}
#con-root .cx-kpi:hover{translate:0 -4px;box-shadow:0 2px 4px rgba(26,34,74,.05),0 34px 56px -20px rgba(26,34,74,.5)}
#con-root .cx-kpi.on{box-shadow:0 0 0 3px var(--navy),0 24px 44px -18px rgba(26,34,74,.38)}
#con-root .cx-kpi .ic{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
#con-root .cx-kpi .ic svg{width:27px;height:27px}
#con-root .cx-kpi b{display:block;font:800 40px/1 'Montserrat',sans-serif;letter-spacing:-1px;color:var(--ink)}
#con-root .cx-kpi span.l{display:block;margin-top:5px;font:700 13.5px 'Inter',sans-serif;color:var(--muted)}
#con-root .cx-kpi.t-warn .ic{background:#fff1d6;color:#b36200}#con-root .cx-kpi.t-mute .ic{background:#e9edf6;color:#4a557a}#con-root .cx-kpi.t-info .ic{background:#dff1fb;color:#0b5d84}
#con-root .cx-kpi.t-ok .ic{background:var(--ok-bg);color:var(--ok)}#con-root .cx-kpi.t-bad .ic{background:var(--err-bg);color:var(--err)}
#con-root .cx-kpi.hot{background:linear-gradient(135deg,#fff 0%,#fff3dc 100%);animation:cxIn .6s both,cxHot 2.2s ease-out .8s infinite}
#con-root .cx-kpi.hot b{color:#b36200}
@keyframes cxHot{0%{box-shadow:0 0 0 0 rgba(255,176,59,.65),0 24px 44px -18px rgba(26,34,74,.38)}70%{box-shadow:0 0 0 14px rgba(255,176,59,0),0 24px 44px -18px rgba(26,34,74,.38)}100%{box-shadow:0 0 0 0 rgba(255,176,59,0),0 24px 44px -18px rgba(26,34,74,.38)}}
@keyframes cxIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cxgira{to{transform:rotate(360deg)}}

/* ── Pestañas grandes ── */
#con-root .cx-tabs{display:flex;gap:6px;padding:6px;margin:0 0 22px;background:#fff;border-radius:22px;box-shadow:0 1px 2px rgba(26,34,74,.05),0 14px 30px -18px rgba(26,34,74,.3);width:fit-content;max-width:100%}
#con-root .cx-tab{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 24px;border:0;border-radius:17px;background:transparent;color:var(--muted);font:800 15px 'Montserrat',sans-serif;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s,transform .12s}
#con-root .cx-tab svg{width:22px;height:22px}
#con-root .cx-tab:hover{background:var(--soft);color:var(--ink)}
#con-root .cx-tab:active{transform:scale(.97)}
#con-root .cx-tab.on{background:linear-gradient(135deg,#4256c4,#2b377a);color:#fff;box-shadow:0 12px 22px -10px rgba(54,68,148,.8)}
#con-root .cx-tab .n{min-width:24px;height:24px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font:800 12px 'Inter',sans-serif}
#con-root .cx-tab.on .n{background:rgba(255,255,255,.22);color:#fff}
#con-root .cx-tab .n.alerta{background:var(--amber);color:#3b1c00}

/* ── Barra de búsqueda y filtros ── */
#con-root .cx-bar{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
#con-root .cx-sbox{position:relative}
#con-root .cx-sbox svg.lupa{position:absolute;left:20px;top:50%;translate:0 -50%;width:23px;height:23px;color:#8792b5;pointer-events:none}
#con-root .cx-search{width:100%;min-height:58px;border:0;border-radius:18px;padding:0 54px 0 56px;background:#fff;box-shadow:0 1px 2px rgba(26,34,74,.06),inset 0 0 0 2px #dbe2ef;font:500 16.5px 'Inter',sans-serif;color:var(--ink);transition:box-shadow .15s}
#con-root .cx-search::placeholder{color:#8a94b6}
#con-root .cx-search:focus{outline:none;box-shadow:0 0 0 5px rgba(53,183,197,.22),inset 0 0 0 2px var(--primary)}
#con-root .cx-sx{position:absolute;right:10px;top:50%;translate:0 -50%;width:40px;height:40px;border:0;border-radius:50%;background:#eef2fb;color:var(--navy);cursor:pointer;display:none;place-items:center}
#con-root .cx-sx.on{display:grid}
#con-root .cx-sx svg{width:17px;height:17px}
#con-root .cx-chips{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#con-root .cx-asel{position:relative;margin-left:auto}
#con-root .cx-asb{display:inline-flex;align-items:center;gap:10px;min-height:46px;max-width:100%;padding:0 14px 0 16px;border:0;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(26,34,74,.06),inset 0 0 0 1.5px #dbe2ef;color:var(--navy);font:700 14.5px 'Inter',sans-serif;cursor:pointer;transition:box-shadow .15s,background .15s}
#con-root .cx-asb:hover{box-shadow:0 4px 14px -6px rgba(26,34,74,.3),inset 0 0 0 1.5px #b9c6e6}
#con-root .cx-asb>svg:first-child{width:19px;height:19px;color:#35B7C5;flex:none}
#con-root .cx-asb .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#con-root .cx-asb .n{flex:none;min-width:26px;height:24px;padding:0 8px;border-radius:999px;display:inline-grid;place-items:center;background:#eef2fb;color:var(--navy);font:800 12.5px 'Inter',sans-serif}
#con-root .cx-asb .cv{width:17px;height:17px;flex:none;color:#7b86ab;transition:transform .2s}
#con-root .cx-asel.fil .cx-asb{background:linear-gradient(135deg,#364494,#2b377a);color:#fff;box-shadow:0 8px 18px -8px rgba(54,68,148,.7)}
#con-root .cx-asel.fil .cx-asb>svg:first-child{color:#8fe1ea}#con-root .cx-asel.fil .cx-asb .n{background:rgba(255,255,255,.2);color:#fff}#con-root .cx-asel.fil .cx-asb .cv{color:#cfe9ee}
#con-root .cx-asel.on .cv{transform:rotate(180deg)}
#con-root .cx-asm{position:absolute;right:0;top:calc(100% + 10px);z-index:30;width:320px;max-width:calc(100vw - 24px);max-height:340px;overflow:auto;padding:8px;border-radius:20px;background:#fff;box-shadow:0 24px 50px -12px rgba(26,34,74,.4),0 0 0 1px rgba(26,34,74,.08);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;visibility:hidden;transition:opacity .16s,transform .16s,visibility .16s}
#con-root .cx-asel.on .cx-asm{opacity:1;transform:none;pointer-events:auto;visibility:visible}
#con-root .cx-ash{padding:8px 12px 6px;font:800 11px 'Montserrat',sans-serif;letter-spacing:1.6px;text-transform:uppercase;color:#7b86ab}
#con-root .cx-asi{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 12px 6px 8px;border:0;border-radius:14px;background:transparent;color:var(--ink);font:600 15px 'Inter',sans-serif;text-align:left;cursor:pointer}
#con-root .cx-asi:hover,#con-root .cx-asi:focus-visible{background:#eef2fb}
#con-root .cx-asi .av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#35B7C5,#2a8f9b);color:#fff;font:800 13px 'Inter',sans-serif}
#con-root .cx-asi .av.todos{background:linear-gradient(135deg,#364494,#232d61)}#con-root .cx-asi .av svg{width:20px;height:20px}
#con-root .cx-asi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#con-root .cx-asi .n{flex:none;min-width:26px;height:24px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:#eef2fb;color:var(--navy);font:800 12.5px 'Inter',sans-serif}
#con-root .cx-asi .ck{width:18px;height:18px;flex:none;color:#0a8f6a;opacity:0}
#con-root .cx-asi.on{background:#e6f6f8}#con-root .cx-asi.on .ck{opacity:1}#con-root .cx-asi.on .nm{font-weight:800;color:var(--navy)}
#con-root .cx-chip{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 18px;border:0;border-radius:999px;background:#fff;color:var(--muted);font:700 14.5px 'Inter',sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(26,34,74,.06),inset 0 0 0 1.5px #dbe2ef;transition:background .15s,color .15s,box-shadow .15s,transform .12s}
#con-root .cx-chip:hover{color:var(--ink);box-shadow:0 6px 14px -8px rgba(26,34,74,.35),inset 0 0 0 1.5px var(--primary)}
#con-root .cx-chip:active{transform:scale(.97)}
#con-root .cx-chip.on{background:var(--navy);color:#fff;box-shadow:0 10px 18px -10px rgba(54,68,148,.8)}
#con-root .cx-chip .n{min-width:24px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:var(--soft);color:var(--muted);font:800 11.5px 'Inter',sans-serif}
#con-root .cx-chip.on .n{background:rgba(255,255,255,.22);color:#fff}
#con-root .cx-cnt{font:600 13px 'Inter',sans-serif;color:var(--muted);margin:2px 4px 12px}

/* ── Tarjeta de contrato / documento ── */
#con-root .cx-list{display:flex;flex-direction:column;gap:16px}
#con-root .cx-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:22px;background:#fff;border-radius:24px;padding:22px 24px 22px 30px;box-shadow:0 2px 4px rgba(26,34,74,.04),0 22px 44px -22px rgba(26,34,74,.32);transition:translate .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
#con-root .cx-card:hover{translate:0 -3px;box-shadow:0 2px 4px rgba(26,34,74,.04),0 30px 54px -22px rgba(26,34,74,.42)}
#con-root .cx-card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:7px;border-radius:0 7px 7px 0;background:#c4cce2}
#con-root .cx-card.e-EN_REVISION::before{background:linear-gradient(180deg,#ffc65a,#ff8a3d)}
#con-root .cx-card.e-APROBADO::before,#con-root .cx-card.e-REVISADO::before{background:linear-gradient(180deg,#3be8a5,#0f9d6e)}
#con-root .cx-card.e-CANCELADO::before,#con-root .cx-card.e-OBSERVADO::before{background:linear-gradient(180deg,#ff6b7a,#d92d3f)}
#con-root .cx-card.e-COMPLETO::before{background:linear-gradient(180deg,#6ec6f0,#0b6fa0)}
#con-root .cx-card.e-EN_REVISION{background:linear-gradient(135deg,#fff 55%,#fff8ea 100%)}
#con-root .cx-ent .cx-card{animation:cxIn .55s cubic-bezier(.2,.8,.2,1) both}
#con-root .cx-ent .cx-card:nth-child(2){animation-delay:.05s}#con-root .cx-ent .cx-card:nth-child(3){animation-delay:.1s}#con-root .cx-ent .cx-card:nth-child(4){animation-delay:.15s}#con-root .cx-ent .cx-card:nth-child(5){animation-delay:.2s}#con-root .cx-ent .cx-card:nth-child(n+6){animation-delay:.25s}
#con-root .cx-top{display:flex;align-items:flex-start;gap:16px}
#con-root .cx-av{flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(145deg,#364494,#4a5fd0);color:#fff;font:800 18px 'Montserrat',sans-serif;box-shadow:0 10px 18px -8px rgba(54,68,148,.7)}
#con-root .cx-av.pld{background:linear-gradient(145deg,#0f8594,#35B7C5);box-shadow:0 10px 18px -8px rgba(15,133,148,.7)}
#con-root .cx-av svg{width:27px;height:27px}
#con-root .cx-tt{min-width:0;flex:1}
#con-root .cx-tt h3{margin:0;font:800 19px/1.25 'Montserrat',sans-serif;color:var(--ink);letter-spacing:-.2px;overflow-wrap:anywhere}
#con-root .cx-id{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:5px}
#con-root .cx-id code{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#4a557a;background:var(--soft);padding:3px 9px;border-radius:8px}
#con-root .cx-est{display:inline-flex;align-items:center;gap:7px;flex:none;padding:7px 14px 7px 11px;border-radius:999px;font:800 12.5px 'Inter',sans-serif;white-space:nowrap}
#con-root .cx-est svg{width:16px;height:16px}
#con-root .cx-est.e-BORRADOR,#con-root .cx-est.e-SIN_ENVIAR,#con-root .cx-est.e-SIN_TERMINAR{background:#e9edf6;color:#3d4766}
#con-root .cx-est.e-COMPLETO{background:#dff1fb;color:#0b4a6b}
#con-root .cx-est.e-EN_REVISION{background:var(--warn-bg);color:var(--warn)}
#con-root .cx-est.e-OBSERVADO,#con-root .cx-est.e-CANCELADO{background:var(--err-bg);color:#8f1b29}
#con-root .cx-est.e-APROBADO,#con-root .cx-est.e-REVISADO{background:var(--ok-bg);color:#0a6b4a}
#con-root .cx-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:16px 0 0 70px;color:var(--muted);font-size:14px}
#con-root .cx-m{display:inline-flex;align-items:center;gap:8px;min-width:0}
#con-root .cx-m svg{width:18px;height:18px;color:#8792b5}
#con-root .cx-m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
#con-root .cx-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--tint);color:var(--teal);font:800 12px 'Inter',sans-serif;text-decoration:none}
#con-root a.cx-pill:hover{background:#d3edf0}
#con-root .cx-pill.v{background:#eef0fb;color:var(--navy)}
#con-root .cx-aviso{display:flex;align-items:center;gap:10px;margin:14px 0 0 70px;padding:11px 15px;border-radius:14px;font:600 13.5px/1.4 'Inter',sans-serif}
#con-root .cx-aviso svg{width:20px;height:20px}
#con-root .cx-aviso.warn{background:var(--warn-bg);color:#7a5200}
#con-root .cx-aviso.bad{background:var(--err-bg);color:#8f1b29}
#con-root .cx-aviso.ok{background:var(--ok-bg);color:#0a6b4a}
#con-root .cx-aviso.info{background:var(--tint);color:#16465a}
#con-root .cx-aviso.mute{background:var(--soft);color:#4a557a}
#con-root .cx-aviso q{quotes:"“" "”";font-style:italic}

/* ── Botones ── */
#con-root .cx-act{display:flex;flex-direction:column;gap:10px;justify-content:center;position:relative}
#con-root .cx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 18px;border:0;border-radius:15px;background:#eef2fb;color:var(--navy);font:800 14.5px 'Montserrat',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .12s,box-shadow .15s}
#con-root .cx-btn svg{width:20px;height:20px}
#con-root .cx-btn:hover{background:#dfe6f8}
#con-root .cx-btn:active{transform:scale(.97)}
#con-root .cx-btn.pri{min-height:54px;background:linear-gradient(135deg,#4256c4,#2b377a);color:#fff;font-size:15.5px;box-shadow:0 12px 22px -10px rgba(54,68,148,.85)}
#con-root .cx-btn.pri:hover{background:linear-gradient(135deg,#4a5fd0,#2b377a)}
#con-root .cx-btn.rev{min-height:54px;background:linear-gradient(135deg,#ffb03b,#ff8a3d);color:#3b1c00;font-size:15.5px;box-shadow:0 12px 22px -10px rgba(255,138,61,.85)}
#con-root .cx-btn.rev:hover{background:linear-gradient(135deg,#ffbb55,#ff944d)}

  });
  ROOT.addEventListener('input', function (e) {

    if (t.id === 'cxCampo') { var o = q('dlgC')._o || {}, n = t.value.trim().length; q('dlgC').querySelector('[data-r="dmCnt"]').textContent = t.value.length + ' / ' + (o.max || 500); q('dlgC').querySelector('[data-r="derr"]').classList.remove('on'); var mm = q('dlgC').querySelector('[data-r="dmMin"]'); if (o.min) mm.textContent = n >= o.min ? 'Listo' : 'Escribe al menos ' + o.min + ' caracteres'; return; }
